# Netplan overlay for the perimeter router (ufw-router).
#
# Rendered by the Router Bootstrap phase and installed as
# /etc/netplan/99-cms-router.yaml, so it is processed after the configuration
# the installer wrote (00-installer-config.yaml / 50-cloud-init.yaml).
#
# Why the router needs its own overlay: the shared client autoinstall brings
# every interface up with DHCP, which on the router means three DHCP leases and
# three competing default routes — one of them pointing at the router itself.
# The router is the gateway, so its addressing and its default route must be
# deterministic:
#   * internal and main carry the static gateway addresses of their networks
#     (the client subnets point their `option routers` at exactly these);
#   * the WAN uplink keeps DHCP but wins the default route by metric, so
#     forwarding to the internet is unambiguous.
network:
  version: 2
  ethernets:
    net0:
      match:
        macaddress: "${INT_MAC}"
      dhcp4: false
      addresses:
        - ${INT_ADDR}
    net1:
      match:
        macaddress: "${MAIN_MAC}"
      dhcp4: false
      addresses:
        - ${MAIN_ADDR}
    net2:
      match:
        macaddress: "${WAN_MAC}"
      dhcp4: true
      dhcp4-overrides:
        route-metric: 50
        use-dns: true
      optional: true
