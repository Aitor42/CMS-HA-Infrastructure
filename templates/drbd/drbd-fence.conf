# Managed by the CMS-HA deploy phase (DRBD setup). Do not edit by hand.
#
# STONITH fencing configuration for this node. Read by fence-peer.sh and the
# DRBD failover watchdog. FENCE_COMMAND/FENCE_STATE_COMMAND are shell snippets;
# the literal {domain} is replaced with the peer's libvirt domain name.
FENCE_REQUIRED="{{ .FenceRequired }}"
PEER_DOMAIN="{{ .PeerDomain }}"
FENCE_COMMAND='{{ .FenceCommand }}'
FENCE_STATE_COMMAND='{{ .FenceStateCommand }}'
