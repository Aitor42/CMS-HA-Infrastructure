# alert-rules.yml
# Prometheus alerting rules for the CMS HA infrastructure.
# Covers node availability, disk/memory pressure, service health
# (MariaDB, Nginx, Apache, K3s), HTTP error rates, and generic
# target-down detection.

groups:
  # ── Infrastructure health ──────────────────────────────────────────────────
  - name: infrastructure
    rules:

      # Fires when a node_exporter target is unreachable for over 2 minutes,
      # which usually indicates the host is down or the exporter crashed.
      - alert: NodeDown
        expr: up{job="node_exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} is down"
          description: >-
            The node_exporter target {{ $labels.instance }} has been
            unreachable for more than 2 minutes.

      # Fires when a blackbox HTTP probe fails for over 2 minutes: the load
      # balancer, a CMS frontend, or the network path to them is down. This is
      # end-to-end reachability, unlike 'up' which only checks the exporter.
      - alert: BlackboxProbeFailed
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint {{ $labels.instance }} is unreachable"
          description: >-
            The blackbox probe of {{ $labels.instance }} has been failing for
            more than 2 minutes.

      # Fires when the blackbox HTTP probe succeeds but is slow: the endpoints
      # answer, yet latency is well above the SLO, usually because a backend is
      # degraded or the LB keeps a slow upstream in rotation.
      - alert: ProbeLatencyHigh
        expr: >-
          histogram_quantile(0.95,
            sum by (instance, le) (rate(probe_duration_seconds_bucket{job="blackbox"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow probe for {{ $labels.instance }}"
          description: >-
            The 95th percentile of the blackbox probe duration for
            {{ $labels.instance }} has been above 2 s for more than 5 minutes
            (current value: {{ $value | printf "%.2f" }} s).

      # Fires when any mounted filesystem exceeds 90 % usage.
      # At this level, services may start failing due to lack of disk space.
      - alert: DiskSpaceCritical
        expr: >-
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critical on {{ $labels.instance }}"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }}
            has less than 10 % free space (current value: {{ $value | printf "%.1f" }}%).

      # Early warning when filesystem usage crosses the 80 % threshold,
      # giving operators time to act before reaching the critical level.
      - alert: DiskSpaceWarning
        expr: >-
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space warning on {{ $labels.instance }}"
          description: >-
            Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }}
            has less than 20 % free space (current value: {{ $value | printf "%.1f" }}%).

      # Sustained high memory usage may lead to OOM kills; this alert
      # gives a 5-minute grace period to avoid false positives from spikes.
      - alert: HighMemoryUsage
        expr: >-
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: >-
            Memory usage on {{ $labels.instance }} has been above 85 %
            for more than 5 minutes (current value: {{ $value | printf "%.1f" }}%).

  # ── Service health ─────────────────────────────────────────────────────────
  - name: services
    rules:

      # MariaDB is the single backend database; losing it is an immediate
      # data-path failure, so we alert after just 1 minute.
      - alert: MariaDBDown
        expr: up{job="mysql"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MariaDB exporter {{ $labels.instance }} is down"
          description: >-
            The mysqld_exporter target {{ $labels.instance }} has been
            unreachable for more than 1 minute. Check the MariaDB service
            and the exporter process.

      # Nginx is the single entry point for all external traffic; if it
      # goes down the site is fully unavailable.
      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx exporter {{ $labels.instance }} is down"
          description: >-
            The nginx_exporter target {{ $labels.instance }} has been
            unreachable for more than 1 minute. Check the Nginx service
            and the exporter process on the load balancer.

      # Apache backends are behind the load balancer and can tolerate
      # short outages (the LB will route to the healthy backend), so we
      # use a longer 2-minute window and warning severity.
      - alert: ApacheDown
        expr: up{job="apache"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Apache exporter {{ $labels.instance }} is down"
          description: >-
            The apache_exporter target {{ $labels.instance }} has been
            unreachable for more than 2 minutes. The CMS backend on this
            node may be offline.

      # A kubelet being unreachable for 3 minutes usually means the K3s
      # node has left the cluster or the kubelet process crashed.
      - alert: K3sNodeNotReady
        expr: up{job="k3s_kubelet"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "K3s node {{ $labels.instance }} is not ready"
          description: >-
            The kubelet on {{ $labels.instance }} has been unreachable for
            more than 3 minutes. The node may have left the K3s cluster.

      # A sustained rate of 5xx responses above 5 % signals a backend
      # problem that is affecting real user traffic.
      - alert: HighHTTP5xxRate
        expr: >-
          (rate(nginx_http_requests_total{status=~"5.."}[5m])
           / rate(nginx_http_requests_total[5m])) * 100 > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.instance }}"
          description: >-
            More than 5 % of HTTP responses from Nginx on
            {{ $labels.instance }} returned a 5xx status code over the
            last 5 minutes (current rate: {{ $value | printf "%.1f" }}%).

      # Generic catch-all: any Prometheus scrape target that stays down
      # for 5 minutes. Useful for exporters we might add in the future.
      - alert: PrometheusTargetMissing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus target {{ $labels.instance }} is down"
          description: >-
            The scrape target {{ $labels.instance }} (job {{ $labels.job }})
            has been unreachable for more than 5 minutes.

  # ── Backups (off-DRBD, Garage S3) ──────────────────────────────────────────
  - name: backups
    rules:

      # Fires when the last successful offsite backup is older than 26 hours
      # (or was never recorded). Guards the RPO: a split-brain, a failed
      # CronJob or an unreachable S3 store all surface here.
      - alert: BackupMissing
        expr: >-
          time() - max(cms_backup_last_success_timestamp_seconds) > 93600
          or
          absent(cms_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No successful offsite backup in the last 26 hours"
          description: >-
            The most recent successful offsite MariaDB backup is older than
            26 hours or was never recorded. Check the mariadb-backup CronJob
            and the Garage S3 store on the hypervisor.

      # Fires when the daily restore drill has not succeeded for over 48
      # hours: the backups exist but cannot (or are not) be proven restorable.
      - alert: BackupRestoreTestFailing
        expr: >-
          time() - max(cms_backup_restore_last_success_timestamp_seconds) > 172800
          or
          absent(cms_backup_restore_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Restore drill has not succeeded in the last 48 hours"
          description: >-
            The mariadb-restore-test CronJob has not reported a successful
            restore for more than 48 hours. Backups may be present but
            unrestorable; investigate before you need them.

  # ── High availability (etcd quorum, DRBD, keepalived) ──────────────────────
  - name: high-availability
    rules:

      # etcd needs a majority of its members to make progress. With three
      # servers, losing two leaves no quorum: the API server turns read-only and
      # neither DRBD promotion nor pod rescheduling can proceed.
      #
      # Both clauses are deliberately robust against missing metrics: aggregations
      # over an empty vector yield nothing (not 0), so if etcd metrics are not
      # exposed the alert simply never fires instead of firing spuriously. A
      # total loss of the servers is caught by NodeDown/PrometheusTargetMissing.
      - alert: EtcdNoQuorum
        expr: >-
          max(etcd_server_has_leader) == 0
          or
          count(up{job="etcd"} == 1) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "etcd has no quorum"
          description: >-
            The embedded etcd cluster has no leader or only one of its three
            members is reachable, so there is no majority. The control plane
            cannot commit writes; recover a server before a DRBD failover is
            attempted.

      # DRBD replication link is down: a failover now would lose data, so the
      # watchdog fences the peer instead of promoting.
      - alert: DRBDPeerDown
        expr: cms_drbd_connected == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DRBD peer not connected on {{ $labels.instance }}"
          description: >-
            The DRBD resource on {{ $labels.instance }} has not been Connected
            to its peer for more than 2 minutes. Replication is interrupted;
            check the network and the peer node.

      # Both nodes believe they are primary (or the resource is StandAlone): the
      # classic split-brain. Data is diverging and must be reconciled manually.
      - alert: DRBDSplitBrain
        expr: cms_drbd_split_brain == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "DRBD split-brain on {{ $labels.instance }}"
          description: >-
            The DRBD resource on {{ $labels.instance }} reports StandAlone or
            WFConnection for more than 1 minute. The peers have diverged;
            fencing and manual reconciliation are required.

      # No node reports the Primary role: the DRBD device is not writable
      # anywhere, so MariaDB is down.
      - alert: DRBDNoPrimary
        expr: sum(cms_drbd_primary) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No DRBD primary"
          description: >-
            Neither DRBD node reports the Primary role. The replicated device is
            read-only cluster-wide, so MariaDB cannot serve writes.

      # Exactly one balancer must hold the VIP. Zero means the front door is
      # down; more than one means a VRRP split (two MASTERs fighting).
      - alert: KeepalivedState
        expr: sum(cms_keepalived_state{state="master"}) != 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "keepalived VIP is not held by exactly one balancer"
          description: >-
            The number of load balancers reporting the MASTER VRRP state has
            been different from one for more than 2 minutes (current value:
            {{ $value | printf "%.0f" }}). 0 = entry point down, >1 = VRRP
            split-brain.
