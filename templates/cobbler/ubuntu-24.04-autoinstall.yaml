#cloud-config
autoinstall:
  version: 1
  updates: security
  shutdown: reboot
  locale: es_ES.UTF-8
  keyboard:
    layout: es
  identity:
    hostname: $hostname
    username: ubuntu
    password: "$6$LOCKED$zQ8.e3KlMUuKr2VVoNm4c5UwkHb9XsGdpT1qFaEhWy6LjnrCDivPt0OIZmBx7QgAsk"
  # Live-session cloud-config: this file is also the installer's own user-data,
  # so this block shapes the live environment. The installed system is
  # configured through `identity` and the late-commands below, not from here.
  users:
    - name: ubuntu
      shell: /bin/bash
      sudo: ALL=(ALL) NOPASSWD:ALL
      lock_passwd: true
  ssh:
    install-server: true
    allow-pw: false
  network:
    version: 2
    ethernets:
      all-en:
        match:
          name: "en*"
        dhcp4: true
  apt:
    primary:
      - arches: [default]
        uri: http://archive.ubuntu.com/ubuntu
    disable_suites: [security]
  storage:
    layout:
      name: direct
  late-commands:
    - mkdir -p /target/root/.ssh /target/home/ubuntu/.ssh
    # Fetch authorised public keys from the Jumpstart Cobbler pub endpoint
    - >-
      sh -c 'curl -fsS http://192.168.10.10/cblr/pub/authorized_keys
      || curl -fsS http://192.168.20.10/cblr/pub/authorized_keys'
      >> /target/root/.ssh/authorized_keys
    - >-
      sh -c 'curl -fsS http://192.168.10.10/cblr/pub/authorized_keys
      || curl -fsS http://192.168.20.10/cblr/pub/authorized_keys'
      >> /target/home/ubuntu/.ssh/authorized_keys
    - chmod 700 /target/root/.ssh /target/home/ubuntu/.ssh
    - chmod 600 /target/root/.ssh/authorized_keys /target/home/ubuntu/.ssh/authorized_keys
    - curtin in-target --target=/target -- chown -R ubuntu:ubuntu /home/ubuntu/.ssh
    # Deploy account: non-root, key-only, sudo logged, and passwordless —
    # the SSH layer runs every privileged command as `sudo -n -H bash -c ...`,
    # which fails without NOPASSWD. The `users:` block at the top of this file
    # is the *live* session's cloud-config and never reaches the target, so the
    # grant has to be written here.
    - printf 'Defaults:ubuntu !requiretty\nDefaults log_output\nubuntu ALL=(ALL) NOPASSWD:ALL\n' > /target/etc/sudoers.d/90-cms-ha
    - chmod 440 /target/etc/sudoers.d/90-cms-ha
    # Harden SSH daemon on provisioned node
    - sed -i 's/#\?PasswordAuthentication.*/PasswordAuthentication no/' /target/etc/ssh/sshd_config
    - sed -i 's/#\?PermitRootLogin.*/PermitRootLogin no/' /target/etc/ssh/sshd_config
    - mkdir -p /target/etc/ssh/sshd_config.d
    - echo 'PermitRootLogin no' > /target/etc/ssh/sshd_config.d/01-permitrootlogin.conf
    - curtin in-target --target=/target -- systemctl enable ssh
    # Signal Cobbler that installation is complete to prevent re-PXE on next boot
    - >-
      sh -c 'curl -fsS "http://192.168.10.10/cblr/svc/op/nopxe/system/$hostname"
      || curl -fsS "http://192.168.20.10/cblr/svc/op/nopxe/system/$hostname"
      || true' > /target/root/nopxe_status
