# upstream: Pool with both CMS frontends in the main network
upstream cms_backend {
    server 192.168.20.101 max_fails=3 fail_timeout=30s;  # CMS Frontend 1
    server 192.168.20.102 max_fails=3 fail_timeout=30s;  # CMS Frontend 2

    # Reuse backend connections instead of opening a TCP connection per
    # request. Without this the LB pays a handshake for every proxied request,
    # which is directly visible in the p50/p95 latency the load test reports.
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# HTTP server (Port 80): Permanent redirect (301) to HTTPS
server {
    listen 80;
    server_name cms.fake-enterprise.com;

    return 301 https://$host$request_uri;
}

# HTTPS server (Port 443): Secure reverse proxy
server {
    listen 443 ssl;
    server_name cms.fake-enterprise.com;

    # SSL certificate
    ssl_certificate     /etc/nginx/ssl/cms.crt;
    ssl_certificate_key /etc/nginx/ssl/cms.key;

    # Secure transport protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Bound the request size at the proxy. The PHP mitigations for
    # CVE-2026-109618 / CVE-2026-109619 assume a request can never grow
    # past this, and the same limit is applied by Apache (LimitRequestBody)
    # and by PHP itself (post_max_size).
    client_max_body_size 32m;

    # Compress text assets once at the edge. WordPress pages and their CSS/JS
    # are the bulk of the smoke profile's bytes, so this cuts transfer time
    # without touching the PHP workers.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://cms_backend;

        # Keep-alive to the upstream only works over HTTP/1.1 and requires
        # clearing the client's Connection header. Both are no-ops on health
        # checks but save a connection setup on every real request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Headers required for WordPress to detect it is served over SSL
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
