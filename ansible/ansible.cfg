[defaults]
# The inventory is generated from config.yaml by `cms-ha inventory`.
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = yaml
# Deterministic, human-reviewable diffs.
display_skipped_hosts = False

[inventory]
enable_plugins = yaml, ini

[privilege_escalation]
# Provisioning talks to libvirt on the hypervisor, which requires root.
become = True
become_method = sudo
become_ask_pass = False
