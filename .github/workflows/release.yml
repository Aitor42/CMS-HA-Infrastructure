name: Release

on:
  push:
    tags:
      - "v*"

# The release job needs to create the GitHub release and obtain the OIDC token
# that Cosign exchanges for a short-lived signing certificate. Everything else
# stays read-only.
permissions:
  contents: read

jobs:
  # A local reusable workflow runs against this tag's exact commit. This also
  # handles tags without a prior branch CI run and avoids API polling races.
  ci:
    name: CI for tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  integration-pxe:
    name: PXE gate for tagged commit
    needs: [ci]
    uses: ./.github/workflows/integration-hosted.yml
    permissions:
      contents: read
    with:
      stage: full
      skip_chaos: false
      jumpstart_image: iso
      fast_provisioning: false
      teardown: true

  release:
    name: Build, sign and publish
    needs: [ci, integration-pxe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sigstore.json
            dist/*.tar.gz
            dist/*.sbom.json
          if-no-files-found: error
