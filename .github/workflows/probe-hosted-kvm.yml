name: Probe hosted runner (throwaway)

# Throwaway diagnostic workflow, only reachable from the branch
# `chore/probe-hosted-kvm`. It answers what a standard GitHub-hosted Linux
# runner can actually do for the KVM lab:
#   - is /dev/kvm present and usable (functional test with qemu -accel kvm)?
#   - how much RAM and free disk does the runner really have?
#   - can libvirt be installed and a domain be created there?
# Delete this file and the branch once the output has been read; it is not part
# of the project's CI.

on:
  push:
    branches: ["chore/probe-hosted-kvm"]
  workflow_dispatch:

jobs:
  probe:
    name: Probe runner capabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Hardware, RAM and disk
        run: |
          echo "==== CPU ===="
          nproc
          grep -m1 'model name' /proc/cpuinfo || true
          echo "vmx/svm lines in /proc/cpuinfo: $(grep -cE 'vmx|svm' /proc/cpuinfo)"
          echo
          echo "==== RAM ===="
          free -h
          echo
          echo "==== DISK ===="
          df -h / /tmp 2>/dev/null || df -h
          echo
          echo "==== KVM device ===="
          ls -l /dev/kvm 2>&1 || echo "NO /dev/kvm"
          lsmod | grep -i '^kvm' || echo "(no kvm modules loaded)"
          echo
          echo "==== identity and init ===="
          id
          echo "pid1: $(cat /proc/1/comm)"
          echo
          echo "==== virtualization tooling present? ===="
          for c in virsh qemu-system-x86_64 virt-install docker podman dnsmasq iptables; do
            if command -v "$c" >/dev/null 2>&1; then echo "found:    $c"; else echo "missing:  $c"; fi
          done
          echo
          echo "==== reclaimable disk (preinstalled toolchains) ===="
          sudo du -sh /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache \
                      /usr/local/.ghcup /usr/local/share/boost 2>/dev/null || true

      - name: Functional KVM test (qemu -accel kvm)
        run: |
          set -x
          # Standard unlock used by the Android emulator action on hosted runners.
          sudo usermod -aG kvm "$USER" || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -l /dev/kvm || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq cpu-checker qemu-system-x86 >/dev/null

          echo "==== kvm-ok ===="
          sudo kvm-ok || true

          echo "==== real launch: a KVM domain must start and stay alive ===="
          # -S pauses the guest, so a successful KVM init keeps qemu running and
          # the timeout kills it (exit 124). Any other exit is a KVM failure.
          set +e
          timeout 10 qemu-system-x86_64 -accel kvm -cpu host -m 512 \
            -nographic -nodefaults -S
          code=$?
          set -e
          echo "qemu exit code: $code"
          if [ "$code" = "124" ]; then
            echo "KVM TEST: OK (guest booted with hardware acceleration)"
          else
            echo "KVM TEST: FAILED (see qemu error above)"
          fi

      - name: virt-install 4.1 argument matrix and the default network
        continue-on-error: true
        run: |
          set -x
          sudo apt-get install -y -qq virtinst libvirt-daemon-system libvirt-clients >/dev/null
          for u in virtproxyd.socket virtqemud.socket virtnetworkd.socket \
                   virtstoraged.socket virtnodedevd.socket virtlogd.socket; do
            sudo systemctl start "$u" 2>/dev/null || true
          done
          sleep 3
          sudo chmod 0777 /var/run/libvirt/libvirt-sock 2>/dev/null || true

          echo "==== defining the NAT 'default' network (missing on this image) ===="
          cat > /tmp/default.xml <<'XML'
          <network>
            <name>default</name>
            <forward mode='nat'/>
            <bridge name='virbr0' stp='on' delay='0'/>
            <ip address='192.168.122.1' netmask='255.255.255.0'>
              <dhcp>
                <range start='192.168.122.2' end='192.168.122.254'/>
              </dhcp>
            </ip>
          </network>
          XML
          sudo virsh net-define /tmp/default.xml || true
          sudo virsh net-start default || true
          sudo virsh net-autostart default || true
          virsh net-list --all
          ip -brief addr show virbr0 || true

          echo "==== virt-install version ===="
          virt-install --version

          i=0
          for spec in "--boot hd,network" "--pxe" "--pxe --boot hd,network" "--boot network,hd"; do
            i=$((i + 1))
            echo "===== args: $spec ====="
            # --print-xml emits two documents: the install-time domain and the
            # post-install one. Only the second one's boot order matters.
            # shellcheck disable=SC2086
            out="$(virt-install --connect qemu:///system --name probe-$i --memory 512 \
              --vcpus 1 --os-variant ubuntu24.04 \
              --disk path=/tmp/probe-$i.qcow2,size=1,format=qcow2,bus=virtio \
              --network network=default,model=virtio \
              $spec --wait 0 --noautoconsole --print-xml 2>&1)"
            rc=$?
            echo "exit=$rc"
            echo "$out" | grep -E "ERROR|install method" || echo "(no error)"
            echo "documents: $(echo "$out" | grep -c '<os>')"
            echo "boot devices in order:"
            echo "$out" | grep "<boot dev=" | cat -n
          done
          rm -f /tmp/probe-*.qcow2

      - name: Can libvirt work here?
        continue-on-error: true
        run: |
          set -x
          sudo apt-get install -y -qq \
            libvirt-daemon-system libvirt-clients qemu-kvm dnsmasq-base >/dev/null
          sudo systemctl start virtqemud.socket 2>/dev/null || true
          sudo systemctl start libvirtd 2>/dev/null || true
          sudo systemctl start virtqemud 2>/dev/null || true
          virsh -c qemu:///system version || true
          virsh -c qemu:///system net-list --all || true
          echo "---- default network ----"
          virsh -c qemu:///system net-info default 2>&1 || true
