name: CI Pipeline

on:
  push:
    branches: ["main", "feature/rewrite-in-go"]
  pull_request:
    branches: ["main"]

# Least privilege for every job that does not explicitly need more. The
# security-scan job raises this to security-events: write for its SARIF upload.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Go Build & Test
  # ─────────────────────────────────────────────────────────────────────────────
  build-go:
    name: Build & Test Go CLI
    runs-on: ubuntu-latest
    # Same flags as `make build`, so vet, build and test share one compiler
    # cache entry instead of each invalidating the others' (8.7s vs 0.35s).
    env:
      GOFLAGS: -trimpath
      # Match `make build` (static binary) so compile/vet/test share its cache.
      CGO_ENABLED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Build check (all packages)
        run: go build ./...

      - name: Build CLI binary
        run: |
          make build
          ./cms-ha --help
          echo "✔ Binary built and verified"

      - name: Install libvirt clients (virsh for the test driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients

      - name: Run unit tests with race detection
        run: make test

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Shell Script Linting (ShellCheck) + Syntax Validation (bash -n)
  # ─────────────────────────────────────────────────────────────────────────────
  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: ShellCheck — static analysis
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: .
          ignore_names: "*.res"
        env:
          SHELLCHECK_OPTS: "-e SC2029 -e SC2087 -e SC2034 -e SC2155 -e SC2054 -e SC2046"

      - name: Bash syntax check (bash -n)
        run: |
          echo "Checking bash syntax for all .sh files..."
          ERRORS=0
          while IFS= read -r script; do
            if ! bash -n "$script" 2>&1; then
              echo "  ✗ SYNTAX ERROR: $script"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "*.sh" -not -path "./.git/*")

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS script(s) have syntax errors"
            exit 1
          fi
          echo "✔ All shell scripts pass syntax check"

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. YAML Manifest Validation
  # ─────────────────────────────────────────────────────────────────────────────
  lint-yaml:
    name: Lint YAML Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install yamllint
        run: pip install yamllint

      - name: Yamllint — YAML syntax and style
        run: |
          yamllint -c .yamllint \
            kubernetes/ \
            templates/monitoring/ \
            templates/cobbler/ubuntu-24.04-autoinstall.yaml \
            .github/workflows/

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Kubernetes Manifest Validation (kubeconform)
  # ─────────────────────────────────────────────────────────────────────────────
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kubeconform
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Install kustomize
        run: |
          KUSTOMIZE_VERSION="v5.4.3"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C /usr/local/bin kustomize

      - name: Render kustomize roots (overlay/backups/jobs)
        run: |
          echo "Rendering kustomize roots..."
          kustomize build kubernetes/overlays/lab > /dev/null
          kustomize build kubernetes/backups    > /dev/null
          kustomize build kubernetes/jobs       > /dev/null

      - name: Validate Kubernetes manifests
        run: |
          echo "Validating Kubernetes manifests in kubernetes/..."
          kubeconform \
            -strict \
            -summary \
            -output json \
            -skip Kustomization \
            -ignore-filename-pattern '\.patch\.yaml$' \
            -kubernetes-version 1.29.0 \
            kubernetes/

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Puppet Manifest Validation
  # ─────────────────────────────────────────────────────────────────────────────
  lint-puppet:
    name: Validate Puppet Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
        with:
          ruby-version: '3.2'

      - name: Install puppet-lint
        run: gem install puppet-lint

      - name: Lint Puppet manifests
        run: |
          find puppet/ -name "*.pp" -exec puppet-lint \
            --no-class_inherits_from_params_class-check \
            --no-documentation-check \
            --no-autoloader_layout-check \
            {} +

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Ansible Validation (ansible-lint + playbook syntax check)
  # ─────────────────────────────────────────────────────────────────────────────
  validate-ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install ansible-core and ansible-lint
        run: pip install ansible-core ansible-lint

      - name: Install required collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: ansible-lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: ansible-lint ansible

      - name: Playbook syntax check
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible-playbook --syntax-check \
            -i ansible/inventory/hosts.yml \
            ansible/playbooks/provision.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. Security Scanning — gosec + govulncheck + Trivy
  #    Gate: no HIGH/CRITICAL findings in code (gosec), dependencies
  #    (govulncheck/Trivy vuln) or secrets (Trivy). Kubernetes misconfig is
  #    reported but not blocking (see docs/SECURITY.md).
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan (gosec, govulncheck, Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec — Go SAST (fails on HIGH)
        run: |
          # Pin to the commit that bumps golang.org/x/tools: the v2.29.0
          # release cannot load the export data of the current Go stable
          # toolchain and reports spurious "type errors" for every package
          # (exit 1 with no findings). Revert to @latest once a tagged
          # release includes the fix.
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.1-0.20261015133444-707f2271f665
          gosec -severity high -confidence medium -exclude-dir=tests -fmt sarif -out gosec.sarif ./...
          echo "✔ gosec: no HIGH findings"

      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: gosec.sarif

      - name: govulncheck — reachable vulnerabilities in dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Trivy — dependencies & secrets (BLOCKING on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy — Kubernetes misconfig (report only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table

  # ─────────────────────────────────────────────────────────────────────────────
  # 8. Summary Gate — all checks must pass for merge
  # ─────────────────────────────────────────────────────────────────────────────
  ci-pass:
    name: CI Summary
    if: always()
    needs:
      - build-go
      - lint-shell
      - lint-yaml
      - validate-k8s
      - lint-puppet
      - validate-ansible
      - security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "=== CI Pipeline Results ==="
          echo "build-go:           ${{ needs.build-go.result }}"
          echo "lint-shell:         ${{ needs.lint-shell.result }}"
          echo "lint-yaml:          ${{ needs.lint-yaml.result }}"
          echo "validate-k8s:      ${{ needs.validate-k8s.result }}"
          echo "lint-puppet:        ${{ needs.lint-puppet.result }}"
          echo "validate-ansible:   ${{ needs.validate-ansible.result }}"
          echo "security-scan:      ${{ needs.security-scan.result }}"

          # Fail if any required job failed
          for result in \
            "${{ needs.build-go.result }}" \
            "${{ needs.lint-shell.result }}" \
            "${{ needs.lint-yaml.result }}" \
            "${{ needs.validate-k8s.result }}" \
            "${{ needs.lint-puppet.result }}" \
            "${{ needs.validate-ansible.result }}" \
            "${{ needs.security-scan.result }}"; do
            if [ "$result" = "failure" ]; then
              echo "::error::One or more CI checks failed"
              exit 1
            fi
          done

          echo "✔ All CI checks passed!"
