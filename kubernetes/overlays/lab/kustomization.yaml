# Kustomize overlay — `lab` environment.
#
# Composes the base CMS platform and adds the lab-specific labelling. This is
# the entry point used by the `kubernetes` phase (and by operators):
#
#   kubectl apply -k kubernetes/overlays/lab
#   kubectl diff  -k kubernetes/overlays/lab   # drift check
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cms

resources:
  - ../../base

patches:
  - path: mariadb-labels.patch.yaml
