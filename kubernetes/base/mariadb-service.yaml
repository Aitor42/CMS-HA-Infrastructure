# mariadb-service.yaml
# Servicios de red para MariaDB:
#   - ClusterIP: acceso interno dentro del clúster K3s
#   - NodePort (30306): acceso externo desde los frontales WordPress en la red main
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: cms
  labels:
    app: mariadb
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
  # `app: mariadb` alone would also enroll the backup/restore CronJob pods
  # (they carry the same app label), and neither listens on 3306: a running
  # backup would take a share of the connections to mariadb.cms.svc and the
  # NodePort, breaking clients at random. The role label is what the
  # StatefulSet already sets on the only pod that serves the database.
  selector:
    app: mariadb
    role: database
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-nodeport
  namespace: cms
  labels:
    app: mariadb
spec:
  type: NodePort
  ports:
    - port: 3306
      targetPort: 3306
      nodePort: 30306
      protocol: TCP
      name: mysql
  selector:
    app: mariadb
    role: database
