# mariadb-pv.yaml
# Volumen persistente para almacenar los datos de MariaDB
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb-pv
  labels:
    app: mariadb
    type: local
spec:
  storageClassName: manual
  # Advisory only: hostPath volumes are not size-enforced by kubelet, and the
  # real capacity is the DRBD device (drbd_disk_gb, 3 GiB). The value is left
  # above it deliberately - a PVC's request is immutable, so shrinking it here
  # would make `kubectl apply` fail on any existing claim.
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/mariadb
    type: DirectoryOrCreate
