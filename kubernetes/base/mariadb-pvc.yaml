# mariadb-pvc.yaml
# Solicitud de volumen persistente para MariaDB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: cms
  labels:
    app: mariadb
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  # Must match the PV. Changing the request is rejected on an existing claim
  # (immutable field), and hostPath capacity is advisory anyway.
  resources:
    requests:
      storage: 5Gi
