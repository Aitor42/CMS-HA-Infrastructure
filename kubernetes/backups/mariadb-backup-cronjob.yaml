# mariadb-backup-cronjob.yaml
# Daily WordPress MariaDB backup: dump → local staging volume → off-DRBD S3
# (Garage) upload.
#
# Off-DRBD: the authoritative copies live in the Garage S3 bucket on the
# hypervisor (backup-config/backup-secret, injected by the `kubernetes` phase
# from config.yaml). The local volume is only a staging area so a split-brain
# on the DRBD device can never take the copies with it.
#
#   Schedule : every day at 02:00 UTC (backup.schedule)
#   Retention: backup.retention_days (local + bucket)
#   Metric   : cms_backup_last_success_timestamp_seconds (node-exporter textfile)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: cms
  labels:
    app: mariadb
    purpose: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: mariadb
            purpose: backup
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: drbd-status
                        operator: In
                        values:
                          - primary
          # Allow scheduling on master nodes (same tolerations as MariaDB StatefulSet)
          tolerations:
            - key: "node-role.kubernetes.io/master"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
          initContainers:
            # Dump the database onto the shared staging volume.
            - name: mysqldump
              image: mariadb:10.11@sha256:0d0945c57f75b3a3b9ebe71aedaaad005fa5305054e8fca3d2e42a8c92b43b5e
              imagePullPolicy: IfNotPresent
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mariadb-secret
                      key: MYSQL_ROOT_PASSWORD
              envFrom:
                - configMapRef:
                    name: backup-config
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backups/wordpress-${TIMESTAMP}.sql.gz"

                  echo "[$(date)] Starting MariaDB backup..."

                  # Check available space on the staging volume (>= 50MB free)
                  AVAIL_KB=$(df -P /backups | awk 'NR==2 {print $4}')
                  if [ "${AVAIL_KB}" -lt 51200 ]; then
                    echo "[ERROR] Insufficient disk space on /backups (${AVAIL_KB} KB available, >= 51200 KB required)"
                    exit 1
                  fi

                  mysqldump \
                    --host=mariadb.cms.svc.cluster.local \
                    --port=3306 \
                    --user=root \
                    --password="${MYSQL_ROOT_PASSWORD}" \
                    --single-transaction \
                    --routines \
                    --triggers \
                    --databases wordpress \
                    | gzip > "${BACKUP_FILE}"

                  BACKUP_SIZE=$(stat -c%s "${BACKUP_FILE}" 2>/dev/null || echo 0)
                  if [ "${BACKUP_SIZE}" -lt 100 ]; then
                    echo "[ERROR] Backup file is suspiciously small (${BACKUP_SIZE} bytes)"
                    rm -f "${BACKUP_FILE}"
                    exit 1
                  fi

                  # Hand the object name to the upload container.
                  echo "${BACKUP_FILE}" > /backups/newest.txt
                  echo "[OK] Dump written: ${BACKUP_FILE} (${BACKUP_SIZE} bytes)"

                  # Rotate the local staging copies.
                  DELETED=$(find /backups -name "wordpress-*.sql.gz" -mtime +"${RETENTION_DAYS}" -delete -print | wc -l)
                  echo "[OK] Deleted ${DELETED} old local backup(s)"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          containers:
            # Upload the fresh dump to the off-DRBD S3 bucket and publish the
            # success metric for the alerting rules.
            - name: upload
              image: rclone/rclone:1.68.2@sha256:74c51b8817e5431bd6d7ed27cb2a50d8ee78d77f6807b72a41ef6f898845942b
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsUser: 0
                runAsGroup: 0
              envFrom:
                - configMapRef:
                    name: backup-config
                - secretRef:
                    name: backup-secret
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  export RCLONE_CONFIG_S3_TYPE=s3
                  export RCLONE_CONFIG_S3_PROVIDER=Other
                  export RCLONE_CONFIG_S3_ENDPOINT="${S3_ENDPOINT}"
                  export RCLONE_CONFIG_S3_ACCESS_KEY_ID="${S3_ACCESS_KEY}"
                  export RCLONE_CONFIG_S3_SECRET_ACCESS_KEY="${S3_SECRET_KEY}"
                  export RCLONE_CONFIG_S3_REGION="${S3_REGION}"
                  export RCLONE_CONFIG_S3_FORCE_PATH_STYLE=true

                  BACKUP_FILE=$(cat /backups/newest.txt)
                  OBJ=$(basename "${BACKUP_FILE}")
                  echo "[$(date)] Uploading ${OBJ} to s3://${S3_BUCKET}/ ..."
                  rclone copyto "${BACKUP_FILE}" "s3:${S3_BUCKET}/${OBJ}"

                  # Offsite retention: drop objects older than RETENTION_DAYS.
                  rclone delete "s3:${S3_BUCKET}" --min-age "${RETENTION_DAYS}d" || true

                  echo "[$(date)] Offsite upload OK: ${OBJ}"

                  # Publish the success metric (node-exporter textfile collector).
                  NOW=$(date +%s)
                  cat > /host-metrics/cms_backup.prom <<EOF
                  # HELP cms_backup_last_success_timestamp_seconds Unix time of the last successful offsite backup.
                  # TYPE cms_backup_last_success_timestamp_seconds gauge
                  cms_backup_last_success_timestamp_seconds ${NOW}
                  EOF
                  chmod 0644 /host-metrics/cms_backup.prom
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                - name: node-metrics
                  mountPath: /host-metrics
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mariadb-backup-pvc
            # The node-exporter textfile collector directory (read-only target
            # for the success metric; harmless if node-exporter is not scraping).
            - name: node-metrics
              hostPath:
                path: /var/lib/prometheus/node-exporter
                type: DirectoryOrCreate
