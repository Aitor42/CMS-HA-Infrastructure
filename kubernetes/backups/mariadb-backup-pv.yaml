# mariadb-backup-pv.yaml
# PersistentVolume and PersistentVolumeClaim used as the LOCAL STAGING area for
# the automated MariaDB backups.
#
# Provides 2 GiB of local storage on the DRBD-replicated master node at
# /mnt/data/mariadb-backups. The dump is written here first and then uploaded to
# the off-DRBD Garage S3 bucket (see mariadb-backup-cronjob.yaml): the
# AUTHORITATIVE copies live outside the DRBD device, so a split-brain on the
# replicated volume cannot take them with it. This staging volume only needs to
# outlive a single CronJob run.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mariadb-backup-pv
  labels:
    app: mariadb
    purpose: backup
spec:
  storageClassName: manual
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/mariadb-backups
    type: DirectoryOrCreate

---
# PVC consumed by the mariadb-backup CronJob
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-backup-pvc
  namespace: cms
  labels:
    app: mariadb
    purpose: backup
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
