# Kustomize root — off-DRBD backup stack (Garage S3 upload + restore drill).
#
# Applied only when `backup.engine` is set in config.yaml, because the CronJobs
# consume the `backup-config` ConfigMap and `backup-secret` Secret generated by
# the `kubernetes` phase. Apply with:
#
#   kubectl apply -k kubernetes/backups
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cms

resources:
  - mariadb-backup-pv.yaml
  - mariadb-backup-cronjob.yaml
  - mariadb-restore-test-cronjob.yaml
