# prometheus-rbac.yaml
# Least-privilege read-only access for the Prometheus instance on
# internal-monitor so it can scrape K3s control-plane / kubelet metrics.
#
# Namespace note: this directory deliberately has NO `namespace:` field in its
# kustomization (unlike base/backups/jobs): the ServiceAccount lives in
# kube-system and a `namespace:` transformer would rewrite it. The ServiceAccount
# namespace is set explicitly below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: cms-ha
    app.kubernetes.io/component: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-metrics-reader
  labels:
    app.kubernetes.io/part-of: cms-ha
    app.kubernetes.io/component: monitoring
# Prometheus scrapes kubelet directly on :10250 with static targets (see
# puppet/modules/role/files/prometheus/prometheus.yml), not through the API
# server proxy. The kubelet webhook authorizer therefore only asks for
# `nodes/metrics`; `nodes/proxy` would additionally allow log/exec/port-forward
# style access through the kubelet and is not needed. The /metrics non-resource
# URL covers the API server scrape on :6443. There is no Kubernetes service
# discovery here, so no list/watch on pods, services or endpoints either.
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/part-of: cms-ha
    app.kubernetes.io/component: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-metrics-reader
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: kube-system
